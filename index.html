<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>君见项目库</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
<style>
  :root{--theme-color:#4f46e5}
  .app-name-link{font-weight:700}
  .sidebar{background:#fafafa}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  table{border-collapse:collapse}
  th,td{border:1px solid #e5e7eb;padding:6px 10px}
</style>
</head>
<body>
<div id="app">加载中…</div>
<script>
  window.$docsify = {
    name: '君见项目库',
    repo: '',
    loadSidebar: true,
    subMaxLevel: 2,
    maxLevel: 3,
    homepage: 'README.md',
    search: { placeholder: '搜索项目…', noData: '没有结果', paths: 'auto' },
    copyCode: { buttonText: '复制' },
    pagination: { previousText: '上一篇', nextText: '下一篇' },
    autoHeader: true
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
